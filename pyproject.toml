[project]
name = "calculate_DCF"
version = "0.1.0"
description = "A project to calculate DCF"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
dependencies = [
    "crewai[litellm]>=1.10.1",
    "duckdb>=1.4.4",
    "edgartools>=5.18.0",
    "google-cloud>=0.34.0",
    "google-cloud-storage>=3.10.1",
    "pandas>=3.0.1",
    "python-dotenv>=1.1.1",
    "trafilatura>=2.0.0",
    "yfinance>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "tests"]
